# language=markdown
abstractModifierDocs=\
The `abstract` modifier indicates that the modified member has no implementation.\n\
\n\
It is applicable to classes, modules, class properties, and class methods.\n\
When applied to classes and modules, it indicates that the modified class/module cannot be instantiated as an object.\n\
\n\
When applied to class properties and class methods, it indicates that the property/method has no implementation,\n\
and must be defined by subclasses.

# language=markdown
fixedModifierDocs=\
The `fixed` modifier says "This property cannot be assigned to when I am `new`'d up".\n\
\n\
It is useful when declaring values that are semantically "output" properties; properties that are specifically\n\
computed in terms of other properties.\n\
\n\
For example:\n\
\n\
```pkl\n\
class Sum {\n\
a: Int\n\
b: Int\n\
fixed result: Int = a + b\n\
}\n\
\n\
s: Sum = new { a = 1; b = 2; result = 5 }\n\
                             ^^^^^^^^^^\n\
                             Error; cannot assign to 'result'\n\
```
